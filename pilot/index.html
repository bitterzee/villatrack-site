  function moneyChart(M, today) {
    const p = S.project, start = dnum(p.startDate) != null ? dnum(p.startDate) : today;
    const planPts = M.plan.filter((x) => x.d != null).sort((a, b) => a.d - b.d);
    const fundPts = M.fund.filter((f) => dnum(f.date) != null);
    const evA = S.wbs.length ? evSeries() : [];
    const xs = [start, today].concat(planPts.map((x) => x.d), fundPts.map((f) => dnum(f.date)), M.paidEv.map((e) => e[0]), evA.map((e) => e[0]));
    const x0 = Math.min.apply(null, xs), x1 = Math.max(Math.max.apply(null, xs), x0 + 30);
    const yMax = Math.max(M.t.total, M.funded, 1) * 1.08;
    const W = 760, H = 300, L = 70, R = 128, T = 16, B = 34, pw = W - L - R, ph = H - T - B;
    const X = (d) => L + (d - x0) / (x1 - x0) * pw, Y = (v) => T + ph - v / yMax * ph;
    const step = (pts) => { let s = 'M' + X(pts[0][0]).toFixed(1) + ' ' + Y(0).toFixed(1); let cum = 0; pts.forEach((q) => { s += ' H' + X(q[0]).toFixed(1); cum += q[1]; s += ' V' + Y(cum).toFixed(1); }); return [s, cum]; };
    const series = [];
    let planCum = 0;
    const planArr = planPts.map((x) => { planCum += x.amt + x.co; return [x.d, x.amt + x.co, x.m.seq + ' ' + x.m.name, planCum]; });
    if (planArr.length) { const sp = step([[start, 0]].concat(planArr)); series.push({ k: 'plan', d: sp[0] + ' H' + X(x1).toFixed(1), end: sp[1], label: 'Planned', pts: planArr }); }
    let paidCum = 0;
    const paidArr = M.paidEv.map((e) => { paidCum += e[1]; return [e[0], e[1], e[2], paidCum]; });
    { const sp = step([[start, 0]].concat(paidArr)); const pe = Math.min(Math.max(today, start, paidArr.length ? paidArr[paidArr.length - 1][0] : start), x1); series.push({ k: 'paid', d: sp[0] + ' H' + X(pe).toFixed(1), end: sp[1], label: 'Paid', pts: paidArr, endX: pe }); }
    let fCum = 0;
    const fArr = fundPts.sort((a, b) => dnum(a.date) - dnum(b.date)).map((f) => { fCum += Number(f.idr) || 0; return [dnum(f.date), Number(f.idr) || 0, 'Transfer ' + day(f.date), fCum]; });
    if (fArr.length) { const sp = step([[Math.min(start, fArr[0][0]), 0]].concat(fArr)); series.push({ k: 'fund', d: sp[0] + ' H' + X(Math.min(Math.max(today, fArr[fArr.length - 1][0]), x1)).toFixed(1), end: sp[1], label: 'Funds sent', pts: fArr, endX: Math.min(Math.max(today, fArr[fArr.length - 1][0]), x1) }); }
    if (evA.length) { let d2 = 'M' + X(start).toFixed(1) + ' ' + Y(0).toFixed(1); evA.forEach((e) => { d2 += ' H' + X(e[0]).toFixed(1) + ' V' + Y(e[1]).toFixed(1); }); const ee = Math.min(Math.max(today, evA[evA.length - 1][0]), x1); series.push({ k: 'earn', d: d2 + ' H' + X(ee).toFixed(1), end: evA[evA.length - 1][1], label: 'Work done', pts: evA.map((e, i) => [e[0], e[1] - (i ? evA[i - 1][1] : 0), 'Work done (earned)', e[1]]), endX: ee }); }
    let s = '<div class="tablewrap"><svg class="mchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative spending: planned ' + esc(short(planCum)) + ', paid ' + esc(short(paidCum)) + ', funds sent ' + esc(short(fCum)) + '">';
    for (let i = 0; i <= 4; i++) { const v = yMax / 1.08 * i / 4, y = Y(v); s += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" class="mc-grid"/><text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" class="mc-tick" text-anchor="end">' + esc(short(v).replace('IDR ', '')) + '</text>'; }
    const sd = new Date(x0 * DAY); let m = Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth() + 1, 1) / DAY; const months = (x1 - x0) / 30, every = months > 14 ? 3 : months > 7 ? 2 : 1; let mi = 0;
    while (m < x1) { if (mi++ % every === 0) s += '<text x="' + X(m).toFixed(1) + '" y="' + (H - 12) + '" class="mc-tick" text-anchor="middle">' + esc(new Date(m * DAY).toLocaleDateString(undefined, { month: 'short', year: '2-digit', timeZone: 'UTC' })) + '</text>'; const d = new Date(m * DAY); m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / DAY; }
    s += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" class="mc-axis"/>';
    if (today >= x0 && today <= x1) s += '<line x1="' + X(today).toFixed(1) + '" x2="' + X(today).toFixed(1) + '" y1="' + T + '" y2="' + Y(0) + '" class="mc-today"/><text x="' + (X(today) + 4).toFixed(1) + '" y="' + (T + 10) + '" class="mc-tick">Today</text>';

    labs.forEach((l) => { const ex = l.se.endX != null ? X(l.se.endX) : L + pw; s += '<text x="' + (L + pw + 8) + '" y="' + (l.y - 2).toFixed(1) + '" class="mc-lab">' + esc(l.se.label) + '</text><text x="' + (L + pw + 8) + '" y="' + (l.y + 13).toFixed(1) + '" class="mc-val">' + esc(short(l.se.end)) + '</text>'; if (ex < L + pw - 2) s += '<circle cx="' + ex.toFixed(1) + '" cy="' + Y(l.se.end).toFixed(1) + '" r="3.5" class="mc-dot mc-' + l.se.k + '"/>'; });
    // hover targets
    series.forEach((se) => se.pts.forEach((q) => { s += '<circle cx="' + X(q[0]).toFixed(1) + '" cy="' + Y(q[3]).toFixed(1) + '" r="4" class="mc-dot mc-' + se.k + '"/><circle cx="' + X(q[0]).toFixed(1) + '" cy="' + Y(q[3]).toFixed(1) + '" r="12" class="mc-hit" tabindex="0"><title>' + esc(se.label + ' · ' + q[2] + ' · ' + dshort(q[0]) + ': +' + short(q[1]) + ', total ' + short(q[3]) + (fx() ? ' (' + toF(q[3]) + ')' : '')) + '</title></circle>'; }));
    s += '</svg></div>';
    s += '<div class="legend"><span><i class="ln mc-plan"></i>Planned payments</span><span><i class="ln mc-paid"></i>' + (ctype() === 'labour' ? 'Paid to builder and suppliers' : 'Paid to builder') + '</span><span><i class="ln mc-fund"></i>Funds sent from abroad</span>' + (S.wbs.length ? '<span><i class="ln mc-earn"></i>Work done (earned)</span>' : '') + '<span><i class="today"></i>Today</span></div>';
    return s;
  }

    const steps = S.milestones.slice().sort((a, b) => a.seq - b.seq);
    h += '<section class="section"><h2>How far along is it?</h2><div class="prog panel"><div class="prog-art">' + villaArt() + '</div><div class="prog-side"><div class="ring">' + ringSvg(H.built) + '<div><div class="big">' + H.built + '%</div><div class="hint">of the building work done</div></div></div>' +
      '<p style="margin:0">Now: <strong>' + esc(H.cur ? H.cur.name : 'Finished') + '</strong>' + (H.cur ? ' <span class="hint">(step ' + H.cur.seq + ' of ' + steps.length + ')</span>' : '') + '</p>' +
      '<ol class="steps" aria-label="Building steps">' + steps.map((m) => { const done = DONE_ST.indexOf(m.status) >= 0, now = H.cur && m.id === H.cur.id; return '<li class="' + (done ? 'done' : now ? 'now' : '') + '" title="' + esc(m.name + ': ' + (STATUS[m.status] || [m.status])[0]) + '"><span class="sd">' + (done ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : m.seq) + '</span><span class="sl">' + esc(m.name) + '</span></li>'; }).join('') + '</ol>' +
      '<p class="hint" style="margin:0">' + H.doneN + ' of ' + steps.length + ' steps signed off and paid or being paid.</p></div></div></section>';
    // 5. photos

    const last = S.logs[0];

    if (pics.length) h += '<div class="pstrip">' + pics.slice(0, 6).map((x) => '<figure><img alt="Site photo" loading="lazy" src="' + __vtBlob(x[0]) + '"><figcaption>' + esc(day(x[1])) + '</figcaption></figure>').join('') + '</div>';
    h += last ? '<div class="panel lastup"><div class="hint">' + esc(when(last.at)) + ' · ' + person(last.by) + '</div><p style="margin:4px 0 0;white-space:pre-line">' + esc(clip(last.note, 360)) + '</p></div>' : '<div class="panel empty">' + emptyArt() + '<strong>No site updates yet</strong>The builder posts photos and notes here.</div>';
    h += '</section>';
    // 6. digest
    h += digestBlock();
    // 7. details for decisions and the full list
    const decisions = S.milestones.filter((m) => m.status === 'inspected' || (m.status === 'submitted' && !m.needsInspection));
    if (decisions.length) h += '<section class="section"><h2>Payments waiting for your OK</h2>' + decisions.map((m) => '<div id="ms-' + esc(m.id) + '">' + msCard(m, true) + '</div>').join('') + '</section>';
    const k = 'ov-all';
    h += '<section class="section"><details class="rep big" data-key="' + k + '"' + (S.open[k] ? ' open' : '') + '><summary>All payment steps in detail</summary>' + S.milestones.filter((m) => decisions.indexOf(m) < 0).map((m) => msCard(m, false)).join('') + '</details></section>';
    return h;
  }

  // ===================== contract types: lump-sum, labour-only, cost-plus =====================
  const CTYPES = {
    lump: ['Lump-sum (borongan penuh)', 'One fixed price for labour and materials, paid in stages after each check.'],
    labour: ['Labour-only (borongan jasa), you buy materials', 'The builder is paid a fixed price for labour in stages. You buy materials from suppliers yourself, after checking each delivery.'],
    costplus: ['Cost-plus (reimbursable)', 'You pay the real cost of labour and materials plus the builder’s fee, after checking every receipt. Stages are still inspected before work moves on.']
  };
  const ctype = () => { const t = S.project && S.project.contractType; return CTYPES[t] ? t : 'lump'; };
  const msWord = () => ctype() === 'lump' ? 'milestone' : 'stage';
  function roleTabs(rk) {
    const t = ctype();
    return (ROLES[rk] ? ROLES[rk].tabs : []).filter((x) => x[0] !== 'costs' || (t !== 'lump' && !(rk === 'inspector' && t === 'costplus'))).filter((x) => advOn() || (ADV_TABS[rk] || []).indexOf(x[0]) < 0 || x[0] === S.tab)
      .map((x) => x[0] === 'costs' ? ['costs', t === 'labour' ? 'Materials' : 'Costs and receipts'] : x);
  }
  const rcpt = (ids) => (ids || []).length ? '<div class="actions">' + ids.map((f, i) => '<a class="chip" href="' + __vtBlob(f) + '" target="_blank" rel="noopener">Receipt ' + (i + 1) + '</a>').join('') + '</div>' : '';
  function fileField(key, label) {
    const ids = S.pending[key] || [];
    if (!S.assets) return '<p class="hint" style="margin:0">Attaching ' + esc(label.toLowerCase()) + ' needs edit access to this page.</p>';
    return '<div class="field"><span class="lbl">' + esc(label) + '</span><input type="file" accept="image/*,application/pdf" multiple data-upload="' + esc(key) + '" aria-label="' + esc(label) + '">' + (S.uploading[key] ? '<span class="hint">Uploading…</span>' : '') + '<span class="hint">' + (ids.length ? ids.length + ' file(s) attached' : 'Photo or PDF of the invoice, receipt or nota') + '</span></div>';
  }
  const thread = (arr) => (arr || []).length ? '<ul class="events">' + arr.map((x) => '<li><span class="when">' + esc(when(x.at)) + '</span><span>' + person(x.by) + ' <span class="hint">(' + esc((ROLES[x.role] || {}).label || '') + ')</span>: ' + esc(x.text) + '</span></li>').join('') + '</ul>' : '';

  // ----- labour-only: materials bought by the owner -----
  const MAT_CATS = ['Cement and concrete', 'Steel and rebar', 'Bricks and blocks', 'Sand and aggregate', 'Timber', 'Roofing', 'Tiles and stone', 'Sanitary and plumbing', 'Electrical', 'Paint and finishes', 'Tools and consumables', 'Other'];
  const PUR_STATUS = { requested: ['Waiting for owner OK', 'warn'], approved: ['Ordered, waiting for delivery', 'info'], delivered: ['Delivered, to pay', 'warn'], paid: ['Paid', 'good'], rejected: ['Not approved', 'bad'] };
  const purAmt = (x) => Number(x.status === 'paid' ? (x.paidAmount || x.amount) : x.amount) || 0;
  function matModel() {
    const p = S.project || {}, L = S.purchases;
    const sum = (f) => L.filter(f).reduce((s, x) => s + purAmt(x), 0);
    const budget = Number(p.materialsBudget) || 0, paid = sum((x) => x.status === 'paid'), owed = sum((x) => x.status === 'approved' || x.status === 'delivered'), requested = sum((x) => x.status === 'requested');
    const byCat = {}; L.filter((x) => x.status === 'paid' || x.status === 'approved' || x.status === 'delivered').forEach((x) => { byCat[x.category || 'Other'] = (byCat[x.category || 'Other'] || 0) + purAmt(x); });
    return { budget: budget, paid: paid, owed: owed, requested: requested, committed: paid + owed, left: budget - paid - owed, byCat: byCat };
  }
  function materialsView() {
    const r = role(), Mt = matModel(), canReq = r === 'contractor' || r === 'admin', canOk = r === 'owner' || r === 'admin';
    let h = projectHead('Materials', 'You buy the materials; the builder supplies the labour. The builder asks for each order, you OK it, someone on site checks the delivery against the order with a photo, then you pay the supplier.');
    const over = Mt.budget && Mt.committed + Mt.requested > Mt.budget;
    h += '<div class="tiles">' +
      '<div class="tile"><span class="label">Materials budget</span><span class="value">' + (Mt.budget ? short(Mt.budget) : '—') + '</span><span class="foot">' + (Mt.budget ? (fx() ? toF(Mt.budget) : 'Set in Project setup') : 'The admin sets it in Project setup') + '</span></div>' +
      '<div class="tile"><span class="label">Paid to suppliers</span><span class="value">' + short(Mt.paid) + '</span><div class="bar" aria-hidden="true"><span style="width:' + (Mt.budget ? Math.min(100, Mt.paid / Mt.budget * 100) : 0) + '%"></span></div><span class="foot">' + (Mt.budget ? Math.round(Mt.paid / Mt.budget * 100) + '% of the budget' : '') + '</span></div>' +
      '<div class="tile"><span class="label">Ordered, not paid yet</span><span class="value">' + short(Mt.owed) + '</span><span class="foot">' + short(Mt.requested) + ' more waiting for ' + (canOk ? 'your' : 'the owner’s') + ' OK</span></div>' +
      '<div class="tile"><span class="label">Left in the budget</span><span class="value" style="color:' + (over ? 'var(--bad)' : 'inherit') + '">' + (Mt.budget ? short(Mt.left) : '—') + '</span><span class="foot">' + (over ? 'Orders would go over the budget' : 'After everything ordered') + '</span></div></div>';
    const cats = Object.keys(Mt.byCat).sort((a, b) => Mt.byCat[b] - Mt.byCat[a]);
    if (cats.length) { const mx = Mt.byCat[cats[0]]; h += '<div class="panel"><div class="lbl" style="margin-bottom:8px">Spent and ordered by type</div><ul class="catbars">' + cats.map((c) => '<li><span>' + esc(c) + '</span><span class="cb"><i style="width:' + (Mt.byCat[c] / mx * 100) + '%"></i></span><b>' + esc(short(Mt.byCat[c])) + '</b></li>').join('') + '</ul></div>'; }
    if (canReq) h += S.open['pur-new'] ? purForm() : '<div class="actions"><button type="button" class="btn ghost" data-act="open" data-key="pur-new">Request materials</button></div>';
    const L = S.purchases.slice().sort((a, b) => (b.num || 0) - (a.num || 0));
    if (!L.length) return h + '<div class="panel empty">' + emptyArt() + '<strong>No material orders yet</strong>' + (canReq ? 'Request each order with the quantity, supplier and estimated price.' : 'The builder requests orders here for you to OK.') + '</div>';
    const sec = (title, f, open) => { const a = L.filter(f); if (!a.length) return ''; const k = 'pursec-' + title; return open ? '<section class="section"><h2>' + esc(title) + ' (' + a.length + ')</h2>' + a.map(purCard).join('') + '</section>' : '<section class="section"><details class="rep big" data-key="' + k + '"' + (S.open[k] ? ' open' : '') + '><summary>' + esc(title) + ' (' + a.length + ')</summary>' + a.map(purCard).join('') + '</details></section>'; };
    return h + sec(canOk ? 'Waiting for your OK' : 'Waiting for the owner', (x) => x.status === 'requested', true) + sec('Delivered, to pay', (x) => x.status === 'delivered', true) + sec('Ordered, waiting for delivery', (x) => x.status === 'approved', true) + sec('Paid', (x) => x.status === 'paid', false) + sec('Not approved', (x) => x.status === 'rejected', false);
  }
  function purCard(x) {
    const r = role(), id = x.id, st = PUR_STATUS[x.status] || [x.status, ''];
    const canOk = r === 'owner' || r === 'admin', canRecv = r === 'contractor' || r === 'inspector' || r === 'admin';
    const short_ = x.deliveredQty != null && Number(x.deliveredQty) < Number(x.qty);
    let h = '<article class="ms' + ((canOk && (x.status === 'requested' || x.status === 'delivered')) || (canRecv && x.status === 'approved') ? ' attn' : '') + '" data-ak="pur-' + esc(id) + '-' + esc(x.status) + '">';
    h += '<div class="ms-head"><div><div class="ms-title">PO-' + pad2(x.num) + ' · ' + esc(x.item) + '</div><div class="ms-meta">' + esc(x.qty) + ' ' + esc(x.unit || '') + ' · ' + esc(x.category || 'Other') + (x.supplier ? ' · ' + esc(x.supplier) : '') + (x.needBy ? ' · Needed by ' + esc(day(x.needBy)) : '') + '</div></div><div class="actions"><span class="num" style="font-weight:700">' + idr(purAmt(x)) + '</span><span class="pill ' + st[1] + '">' + esc(st[0]) + '</span></div></div>';
    if (x.note) h += '<p style="margin:0">' + esc(x.note) + '</p>';
    h += wbsLine('purchases/' + id, x.wbs);
    if (x.deliveredAt) h += '<div class="fixbox"><span class="lbl">Delivery check</span><p style="margin:0">' + esc(x.deliveredQty) + ' ' + esc(x.unit || '') + ' received' + (short_ ? ' <span class="pill bad">Short by ' + esc(Number(x.qty) - Number(x.deliveredQty)) + '</span>' : ' <span class="pill good">Matches the order</span>') + (x.deliveryNote ? '. ' + esc(x.deliveryNote) : '') + '</p>' + photos(x.deliveryPhotos) + '</div>';
    h += rcpt(x.receipts);
    const ev = [[x.requestedAt, person(x.requestedBy) + ' requested it']];
    if (x.approvedAt) ev.push([x.approvedAt, person(x.approvedBy) + (x.status === 'rejected' ? ' didn’t approve it' + (x.rejectNote ? ': ' + esc(x.rejectNote) : '') : ' approved the order')]);
    if (x.deliveredAt) ev.push([x.deliveredAt, person(x.deliveredBy) + ' checked the delivery']);
    if (x.paidAt) ev.push([x.paidAt, person(x.paidBy) + ' paid the supplier ' + idr(x.paidAmount || x.amount)]);
    h += '<ul class="events">' + ev.filter((e) => e[0]).map((e) => '<li><span class="when">' + esc(when(e[0])) + '</span><span>' + e[1] + '</span></li>').join('') + '</ul>';
    if (canOk && x.status === 'requested') {
      if (S.open['purrej-' + id]) h += '<form class="box" data-form="pur-reject" data-id="' + esc(id) + '"><div class="field"><label for="prn-' + id + '">Why not?</label><input id="prn-' + id + '" required placeholder="e.g. Price too high, get a second quote"></div><div class="actions"><button class="btn danger" type="submit">Don’t approve</button><button class="btn quiet" type="button" data-act="close" data-key="purrej-' + esc(id) + '">Cancel</button></div></form>';
      else h += '<div class="actions"><button type="button" class="btn" data-act="pur-approve" data-id="' + esc(id) + '">OK, order it</button><button type="button" class="btn quiet" data-act="open" data-key="purrej-' + esc(id) + '">Don’t approve</button></div>';
    }
    if (canRecv && x.status === 'approved') {
      if (S.open['deliv-' + id]) h += '<form class="box" data-form="pur-deliver" data-id="' + esc(id) + '"><div class="grid2"><div class="field"><label for="pdq-' + id + '">Quantity received (' + esc(x.unit || 'units') + ')</label><input id="pdq-' + id + '" inputmode="decimal" required value="' + esc(x.qty) + '"></div><div class="field"><label for="pdn-' + id + '">Note</label><input id="pdn-' + id + '" placeholder="e.g. 2 bags torn, brand matches the approved one"></div></div>' + photoField('deliv-' + id) + '<div class="actions"><button class="btn" type="submit">Confirm delivery</button><button class="btn quiet" type="button" data-act="close" data-key="deliv-' + esc(id) + '">Cancel</button></div></form>';
      else h += '<div class="actions"><button type="button" class="btn" data-act="open" data-key="deliv-' + esc(id) + '">Check the delivery</button><span class="hint">Count it and take a photo of the delivery note.</span></div>';
    }
    if (canOk && x.status === 'delivered') {
      if (S.open['purpay-' + id]) h += '<form class="box" data-form="pur-pay" data-id="' + esc(id) + '"><div class="grid2"><div class="field"><label for="ppa-' + id + '">Amount paid (IDR)</label><input id="ppa-' + id + '" inputmode="numeric" required value="' + esc(x.amount) + '"></div><div class="field"><label for="ppd-' + id + '">Paid on</label><input id="ppd-' + id + '" type="date" required value="' + esc(diso(todayN())) + '"></div></div>' + fileField('paid-' + id, 'Invoice or receipt') + '<div class="actions"><button class="btn" type="submit">Record payment</button><button class="btn quiet" type="button" data-act="close" data-key="purpay-' + esc(id) + '">Cancel</button></div></form>';
      else h += '<div class="actions"><button type="button" class="btn" data-act="open" data-key="purpay-' + esc(id) + '">I paid the supplier</button>' + (short_ ? '<span class="hint" style="color:var(--bad)">Pay only for what arrived.</span>' : '') + '</div>';
    }
    return h + '</article>';
  }
  function purForm() {
    return '<form class="panel" data-form="pur-new" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:17px">Request materials</h2><div class="grid2">' +

  // ----- cost-plus: receipts, fee, cap, retention -----
  const COST_CATS = ['Labour', 'Materials', 'Equipment hire', 'Subcontractor', 'Permits and fees', 'Transport', 'Other'];
  const COST_STATUS = { submitted: ['Waiting for review', 'warn'], queried: ['Question asked', 'info'], approved: ['Approved, to pay', 'good'], rejected: ['Rejected', 'bad'], paid: ['Paid', 'good'] };
  function costModel() {
    const p = S.project || {}, fee = Number(p.feePct) || 0, ret = p.retentionPct == null || p.retentionPct === '' ? 5 : Number(p.retentionPct) || 0;
    const est = Number(p.contractValue) || 0, gmp = Number(p.gmp) || 0;
    const g = (c) => Math.round(c * (1 + fee / 100));
    const sum = (f) => S.costs.filter(f).reduce((s, x) => s + (Number(x.amount) || 0), 0);
    const pend = sum((x) => x.status === 'submitted' || x.status === 'queried'), appr = sum((x) => x.status === 'approved'), paidCost = sum((x) => x.status === 'paid');
    const claims = S.costPays.filter((x) => x.type !== 'retention'), rels = S.costPays.filter((x) => x.type === 'retention');
    const paidNet = S.costPays.reduce((s, x) => s + (Number(x.net) || 0), 0);
    const retHeld = claims.reduce((s, x) => s + (Number(x.retention) || 0), 0) - rels.reduce((s, x) => s + (Number(x.net) || 0), 0);
    const budget = gmp || g(est);
    const spentGross = g(paidCost), approvedGross = g(appr), pendingGross = g(pend), projected = spentGross + approvedGross + pendingGross;
    const byCat = {}; S.costs.filter((x) => x.status === 'paid' || x.status === 'approved').forEach((x) => { byCat[x.category || 'Other'] = (byCat[x.category || 'Other'] || 0) + (Number(x.amount) || 0); });
    return { fee: fee, ret: ret, est: est, gmp: gmp, budget: budget, g: g, pend: pend, appr: appr, paidCost: paidCost, paidNet: paidNet, retHeld: Math.max(0, retHeld), spentGross: spentGross, approvedGross: approvedGross, pendingGross: pendingGross, projected: projected, byCat: byCat };
  }
  function costsView() {
    const r = role(), C = costModel(), canSub = r === 'contractor' || r === 'admin', canRev = r === 'owner' || r === 'admin';
    let h = projectHead('Costs and receipts', 'The builder submits every cost with its receipt. You (or the admin for you) check each one. Approved costs are paid with the builder’s ' + C.fee + '% fee' + (C.ret ? ', keeping ' + C.ret + '% as retention until the defect list is empty' : '') + '.');
    const capPct = C.gmp ? C.projected / C.gmp * 100 : 0;
    h += '<div class="tiles">' +
      '<div class="tile"><span class="label">Spent so far, incl. fee</span><span class="value">' + short(C.spentGross) + '</span><span class="foot">' + short(C.paidNet) + ' paid · ' + short(C.retHeld) + ' held as retention</span></div>' +
      '<div class="tile"><span class="label">Approved, to pay</span><span class="value">' + short(C.approvedGross) + '</span><span class="foot">' + short(C.appr) + ' costs + ' + short(C.approvedGross - C.appr) + ' fee</span></div>' +
      '<div class="tile"><span class="label">Waiting for review</span><span class="value" style="color:' + (C.pend ? 'var(--warn)' : 'inherit') + '">' + short(C.pend) + '</span><span class="foot">' + S.costs.filter((x) => x.status === 'submitted' || x.status === 'queried').length + ' receipts</span></div>' +
      '<div class="tile"><span class="label">' + (C.gmp ? 'Against the cap' : 'Against the estimate') + '</span><span class="value" style="color:' + (capPct >= 100 ? 'var(--bad)' : capPct >= 80 ? 'var(--warn)' : 'inherit') + '">' + ((C.projected / Math.max(1, C.budget) * 100) < 1 && C.projected > 0 ? '&lt;1' : Math.round(C.projected / Math.max(1, C.budget) * 100)) + '%</span><div class="bar" aria-hidden="true"><span style="width:' + Math.min(100, C.projected / Math.max(1, C.budget) * 100) + '%"></span></div><span class="foot">' + short(C.projected) + ' of ' + short(C.budget) + (C.gmp ? ' maximum' : '') + '</span></div></div>';
    if (C.gmp && capPct >= 80) h += '<div class="note ' + (capPct >= 100 ? 'bad' : 'warn') + '">' + (capPct >= 100 ? 'Costs submitted so far go over the agreed maximum price. Under a capped contract, anything above it is the builder’s cost unless you approve a change order.' : 'Costs are at ' + Math.round(capPct) + '% of the agreed maximum price. Ask the builder for a cost-to-complete forecast.') + '</div>';
    const cats = Object.keys(C.byCat).sort((a, b) => C.byCat[b] - C.byCat[a]);
    if (cats.length) { const mx = C.byCat[cats[0]]; h += '<div class="panel"><div class="lbl" style="margin-bottom:8px">Approved costs by type (before fee)</div><ul class="catbars">' + cats.map((c) => '<li><span>' + esc(c) + '</span><span class="cb"><i style="width:' + (C.byCat[c] / mx * 100) + '%"></i></span><b>' + esc(short(C.byCat[c])) + '</b></li>').join('') + '</ul></div>'; }
    if (r === 'admin') h += costPayPanel(C);
    if (canSub) h += S.open['cost-new'] ? costForm() : '<div class="actions"><button type="button" class="btn ghost" data-act="open" data-key="cost-new">Submit a cost</button></div>';
    const L = S.costs.slice().sort((a, b) => (b.num || 0) - (a.num || 0));
    if (!L.length) return h + '<div class="panel empty">' + emptyArt() + '<strong>No costs submitted yet</strong>' + (canSub ? 'Submit each cost with a photo of its receipt or nota.' : 'The builder submits costs here with receipts for you to check.') + '</div>';

  function wbsFacts() {

  async function onActWBS(el) {
    const a = el.dataset.act, id = el.dataset.id;
    if (a === 'wbs-tog') { S.wbsOpen = S.wbsOpen || {}; S.wbsOpen[id] = !S.wbsOpen[id]; render(); return true; }
    if (a === 'wbs-all') { S.wbsOpen = {}; if (id === '1') S.wbs.forEach((w) => { S.wbsOpen[w.code] = true; }); render(); return true; }
    if (a === 'wbs-edit') { S.editWbs = id; render(); window.scrollTo({ top: 0, behavior: motionOK() ? 'smooth' : 'auto' }); return true; }
    if (a === 'wbs-new') { S.editWbs = '__new'; render(); window.scrollTo({ top: 0, behavior: motionOK() ? 'smooth' : 'auto' }); return true; }
    if (a === 'wbs-cancel') { S.editWbs = null; render(); return true; }
    if (a === 'wbs-del') {
      if (!S.open['delw-' + id]) { S.open['delw-' + id] = true; toast('Tap Delete package again to confirm. Items coded to it become “Not coded”.'); return true; }
      try { await S.db.doc('wbs/' + wid(id)).delete(); await audit('Deleted WBS package ' + id); S.editWbs = null; S.open['delw-' + id] = false; } catch (e) { fail(e); }
      return true;
    }
    if (a === 'wbs-template') {
      el.disabled = true; const base = wbsBase();
      try {
        for (const t of WBS_TPL) {
          const leaf = t.length > 2, d = { code: t[0], name: t[1], dummy: false };
          if (leaf) Object.assign(d, { budget: Math.round(base * (t[2] || 0) / 100 / 1e5) * 1e5, ms: t[3] || null, resp: t[4] || 'contractor', steps: t[5] ? ST[t[5]].map((s) => [s[0], s[1], false]) : [], hist: [], kind: t[6] || null });
          await S.db.doc('wbs/' + wid(t[0])).set(d);
        }
        for (const ac of S.acts) if (!ac.wbs && ACT_WBS[ac.code]) await S.db.doc('activities/' + ac.code).update({ wbs: ACT_WBS[ac.code] });
        await audit('Loaded the villa WBS template (' + WBS_TPL.length + ' elements) on a construction base of ' + idr(base));
        S.wbsOpen = { '2': true, '2.2': true }; toast('WBS loaded. Edit any budget or step.'); celebrate();
      } catch (e) { fail(e); }
      return true;
    }
    return false;
  }
  async function onFormWBS(form, v) {
    if (form.dataset.form !== 'wbs') return false;
    const r = role(), canBud = r === 'owner' || r === 'admin', canProg = r === 'contractor' || r === 'inspector' || r === 'admin';
    const isNew = S.editWbs === '__new';
    let w = isNew ? null : S.wbs.find((x) => x.code === S.editWbs); if (!isNew && !w) return true;
    let code = w ? w.code : '';
    if (isNew) { const par = v('#wf-parent'); const kids = S.wbs.filter((x) => wparent(x.code) === par).map((x) => Number(String(x.code).split('.').pop()) || 0); code = par + '.' + (kids.length ? Math.max.apply(null, kids) + 1 : 1); }
    const patch = {};
    if (canBud) {
      patch.name = v('#wf-name') || (w && w.name) || 'Package';
      if (!(w && w.kind === 'changes')) patch.budget = digits(v('#wf-bud'));
      if (form.querySelector('#wf-resp')) patch.resp = v('#wf-resp') || 'contractor';
      if (form.querySelector('#wf-ms')) patch.ms = Number(v('#wf-ms')) || null;
      if (form.querySelector('#wf-com')) { patch.committed = digits(v('#wf-com')); patch.paid = digits(v('#wf-paid')); }
    }
    let steps = (w && w.steps) || (isNew ? ST.gen.map((s) => [s[0], s[1], false]) : []);
    steps = steps.map((s, i) => { const cb = form.querySelector('#wf-st-' + i); return [s[0], s[1], cb && canProg ? cb.checked : !!s[2]]; });
    if (canBud && form.querySelector('#wf-steps')) {
      const parsed = v('#wf-steps').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const m = l.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*%?$/); return m ? [m[1].trim(), Number(m[2].replace(',', '.'))] : [l, 0]; });
      const same = parsed.length === steps.length && parsed.every((p, i) => p[0] === steps[i][0] && p[1] === Number(steps[i][1]));
      if (!same) steps = parsed.map((p) => { const old = steps.find((s) => s[0] === p[0]); return [p[0], p[1], old ? !!old[2] : false]; });
      const sum = steps.reduce((s, x) => s + (Number(x[1]) || 0), 0); if (steps.length && Math.round(sum) !== 100) { toast('Step weights add up to ' + sum + '%. Make them 100%.', true); return true; }
    }
    if (String(code).charAt(0) === '2' || isNew) {
      patch.steps = steps;
      const before = w ? progOf(w) : 0, after = progOf({ steps: steps });
      if (after !== before || isNew) { const today = diso(todayN()); const hist = ((w && w.hist) || []).filter((x) => x.d !== today).concat([{ d: today, p: after }]); patch.hist = hist; }
    }
    if (isNew) await S.db.doc('wbs/' + wid(code)).set(Object.assign({ code: code, kind: null, hist: [] }, patch));
    else await S.db.doc('wbs/' + wid(code)).update(patch);
    await audit((isNew ? 'Added' : 'Updated') + ' WBS ' + code + ' (' + (patch.name || w.name) + ')' + (patch.steps ? ', progress ' + progOf({ steps: patch.steps }) + '%' : '') + (patch.budget != null && w && Number(w.budget) !== patch.budget ? ', budget ' + idr(patch.budget) : ''));
    S.editWbs = null; toast('Saved.'); return true;
  }

  function reportHtml(fk, items, meta) {
    const f = FORMS[fk] || FORMS.structure;
    const counts = { pass: 0, note: 0, fail: 0, na: 0 };
    const rows = f.items.map((it) => { const r = items[it[0]] || ['pass', '', '']; counts[r[0]] = (counts[r[0]] || 0) + 1; return [it, r]; });
    const tone = meta.result === 'fail' ? 'bad' : meta.result === 'pass_notes' ? 'warn' : 'good';
    let h = '<div class="report">';
    h += '<div class="row"><div><div class="ms-title">' + esc(f.title) + '</div><div class="ms-meta">' + (meta.example ? 'Example report' : esc(when(meta.at)) + ' · ' + person(meta.by)) + '</div></div><span class="pill ' + tone + '">' + esc(OVERALL[meta.result] || meta.result) + '</span></div>';
    if (meta.summary) h += '<p class="rep-summary">' + esc(meta.summary) + '</p>';
    h += '<p class="hint" style="margin:0">' + counts.pass + ' pass · ' + counts.note + ' with notes · ' + counts.fail + ' failed · ' + counts.na + ' not applicable</p>';
    h += '<div class="tablewrap"><table class="rep-table"><thead><tr><th>Item</th><th>Result</th><th>Measured</th><th>Comment</th></tr></thead><tbody>' + rows.map(([it, r]) => {
      const rr = RESULT[r[0]] || [r[0], ''];
      return '<tr><td><strong style="font-weight:600">' + esc(it[1]) + '</strong><br><span class="hint">' + esc(it[2]) + '</span></td><td><span class="pill ' + rr[1] + '">' + esc(rr[0]) + '</span></td><td class="num">' + (r[1] ? esc(r[1]) + (it[3] ? ' ' + esc(it[3]) : '') : '—') + '</td><td>' + esc(r[2] || '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
    return h;
  }

  async function onForm(form) {
    const kind = form.dataset.form, id = form.dataset.id;
    const btn = form.querySelector('button[type="submit"]');
    const v = (sel) => { const el = form.querySelector(sel); return el ? el.value.trim() : ''; };
    const m = id ? msById(id) : null;
    if (btn) btn.disabled = true;
    try {
      if (await onFormUX(form)) return;
      if (await onFormP1(form, v, id)) return;
      if (await onFormCT(form, v, id)) return;
      if (await onFormWBS(form, v)) return;
      if (kind === 'ms-submit' && m) {
        const key = 'sub-' + id;
        if (S.uploading[key]) { toast('Wait for the photos to finish uploading.', true); return; }
        await S.db.doc('milestones/' + id).update({ status: 'submitted', submittedAt: now(), submittedBy: myId(), submitNote: v('#subnote-' + id), submitPhotos: (S.pending[key] || []).slice(), inspection: null, dispute: null, approvedAt: null, approvedBy: null });
        await audit('Submitted milestone ' + m.seq + ' (' + m.name + ')' + (m.needsInspection ? ' for inspection' : ' for owner approval'));
        S.pending[key] = []; S.open[key] = false; toast('Submitted.');
      } else if (kind === 'ms-request' && m) {
        const key = 'req-' + id, at = fromLocalInput(v('#reqwhen-' + id));
        if (!at) { toast('Choose a date and time for the visit.', true); return; }
        if (S.uploading[key]) { toast('Wait for the photos to finish uploading.', true); return; }
        const isChange = m.status === 'insp_requested';
        const patch = { status: 'insp_requested', requestedAt: now(), requestedBy: myId(), requestedFor: at, requestContact: v('#reqcontact-' + id), requestNote: v('#reqnote-' + id), scheduledAt: null, scheduledBy: null, scheduledFor: null, scheduleNote: null };
        if (!isChange) Object.assign(patch, { submitPhotos: (S.pending[key] || []).slice(), submitNote: v('#reqnote-' + id), submittedAt: now(), submittedBy: myId(), inspection: null, dispute: null, approvedAt: null, approvedBy: null });
        await S.db.doc('milestones/' + id).update(patch);
        await audit((isChange ? 'Changed inspection request' : 'Requested inspection') + ' for milestone ' + m.seq + ' (' + m.name + ') on ' + when(at));
        S.pending[key] = []; S.open[key] = false; toast(isChange ? 'Request updated.' : 'Inspection requested. The inspector will confirm the time.');
      } else if (kind === 'ms-schedule' && m) {
        const at = fromLocalInput(v('#schwhen-' + id));
        if (!at) { toast('Choose a date and time for the visit.', true); return; }
        await S.db.doc('milestones/' + id).update({ status: 'insp_scheduled', scheduledAt: now(), scheduledBy: myId(), scheduledFor: at, scheduleNote: v('#schnote-' + id) });
        await audit('Confirmed inspection visit for milestone ' + m.seq + ' (' + m.name + ') on ' + when(at));
        S.open['sch-' + id] = false; toast('Visit confirmed. The contractor and owner can see the time.');
      } else if (kind === 'ms-inspect' && m) {
        const key = 'insp-' + id, result = v('#insres-' + id), fk = formFor(m), items = {};
        let missing = 0, failNoComment = 0, fails = 0, notes = 0;
        FORMS[fk].items.forEach((it) => {
          const k = id + '-' + it[0], r = v('#ci-' + k), c = v('#cc-' + k);
          if (!r) missing++;
          if (r === 'fail') { fails++; if (!c) failNoComment++; }
          if (r === 'note') notes++;
          items[it[0]] = [r || 'pass', v('#cv-' + k), c];
        });
        if (missing) { toast(missing + ' checklist item(s) have no result yet.', true); return; }
        if (failNoComment) { toast('Add a comment to every failed item so the contractor knows what to fix.', true); return; }
        if (!result) { toast('Choose the overall result.', true); return; }
        if (fails && result !== 'fail') { toast(fails + ' item(s) failed, so the overall result must be Fail.', true); return; }
        if (S.uploading[key]) { toast('Wait for the photos to finish uploading.', true); return; }
        await S.db.doc('milestones/' + id).update({ status: result === 'fail' ? 'failed' : 'inspected', inspection: { form: fk, result: result, notes: v('#insnote-' + id), items: items, photos: (S.pending[key] || []).slice(), at: now(), by: myId() } });
        await audit('Inspection of milestone ' + m.seq + ' (' + m.name + '): ' + ({ pass: 'passed', pass_notes: 'passed with notes', fail: 'failed' }[result]));
        S.pending[key] = []; S.open[key] = false; toast(result === 'fail' ? 'Report sent. The contractor will fix and resubmit.' : 'Passed! Report sent to the owner.'); if (result !== 'fail') celebrate();
      } else if (kind === 'ms-dispute' && m) {

        await audit('Closed dispute on milestone ' + m.seq + (to === 'rework' ? ': contractor to fix and resubmit' : ': back to owner'));

        if (ll.lat > 0 || ll.lat < -11 || ll.lng < 95 || ll.lng > 141) { toast('Those coordinates aren\u2019t in Indonesia. Check the order: latitude first (negative in Bali), then longitude.', true); return; }
        await S.db.doc('project/main').update({ lat: ll.lat, lng: ll.lng, locNote: v('#loc-note') });
        await audit('Set the plot location to ' + ll.lat + ', ' + ll.lng);

      } else if (kind === 'img') {

        S.pending.pin = []; S.newPin = null; S.selPin = r.id; toast('Pin saved.');
